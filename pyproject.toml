[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinlens"
version = "0.1.0"
description = "Compare protein 3D structures, classify folds against CATH, and write LLM reports that are checked against computed numbers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Exact versions used for all results are pinned in requirements.txt (installed by `make setup`).
dependencies = [
    "biopython>=1.85",
    "tmtools>=0.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.24", "py3Dmol>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
proteinlens = "proteinlens.cli:app"

[tool.setuptools.packages.find]
include = ["proteinlens*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access (skipped with -m 'not network')"]
